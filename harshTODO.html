<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
    <link rel="stylesheet" href="harshTODO.css" />
  </head>
  <body>
    <div class="todo-app">
      <header class="todo-header">
        <h1 class="todo-title">Todo List</h1>
        <p class="todo-subtitle">
          Add tasks, mark them complete, and manage them with JS.
        </p>
      </header>

      <!-- Form for adding todos -->
      <form id="todo-form">
        <input
          type="text"
          id="new-todo-input"
          placeholder="What do you need to do?"
          autocomplete="off"
        />
        <button type="submit" id="add-todo-btn">Add</button>
      </form>

      <!-- List of todos -->
      <ul id="todo-list">
        <!-- Example static item (you can remove this; good for JS template reference) -->
        <li class="todo-item">
          <div class="todo-main">
            <input type="checkbox" class="todo-checkbox" />
            <span class="todo-text">Sample task (replace with JS)</span>
          </div>
          <div class="todo-actions">
            <button class="todo-btn edit">Edit</button>
            <button class="todo-btn delete">Delete</button>
          </div>
        </li>
      </ul>

      <footer class="todo-footer">
        <span id="todo-count">0 items left</span>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </footer>
    </div>

    <script src="harshTODO.js"></script>
  </body>
</html>
